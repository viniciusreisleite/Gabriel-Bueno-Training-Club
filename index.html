<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural - Gabriel Bueno Training Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .tv-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background-color: #fff;
    }
    /* Coluna de Video / Midia */
    .video-section {
      flex: 0 0 38%;
      height: 100vh;
      background: #000 !important;
      position: relative;
      overflow: hidden;
    }
    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000 !important;
      background-color: #000 !important;
      display: block;
    }
    /* Coluna de Informacoes */
    .info-section {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 3rem;
      background-color: #ffffff;
      color: #111;
      overflow: hidden;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 1.5rem;
      flex-shrink: 0;
    }
    .header-text .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: #dc2626;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .header-text h1 {
      font-size: 2.5rem;
      font-weight: 900;
      color: #111;
      line-height: 1.1;
    
      text-transform: uppercase !important;
}
    .header-text h1 span {
      color: #dc2626;
    }
    .logo-img {
      max-height: 90px;
      max-width: 180px;
      object-fit: contain;
    }
    /* Area de Legenda com Scroll Oculto */
    
    .caption-container::-webkit-scrollbar {
      display: none;
    }
    
      /* Motor de auto-scroll TV */
    .info-section {
      display: flex !important;
      flex-direction: column !important;
      height: 100vh !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      position: relative !important;
      margin-top: 1.5rem !important;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important;
    }
    .caption-box {
      font-size: 2.7vw !important;
      line-height: 1.4 !important;
      font-weight: 600 !important;
      word-wrap: break-word !important;
      white-space: pre-line !important;
      padding-bottom: 6rem !important;
    }
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <div class="video-section">
      <img id="image-player" style="display:none;" />
      <video id="player" autoplay playsinline muted loop preload="auto">
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">Experiência Premium</span>
          <h1>Gabriel Bueno <span>Studio Fit</span></h1>
        </div>
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          A carregar informações...
        </div>
      </div>
    </div>
  </div>

    <script>
    function iniciarAutoScroll(container) {
      if (!container) return;
      if (window.__scrollInterval) clearInterval(window.__scrollInterval);
      if (window.__scrollTimer) clearTimeout(window.__scrollTimer);

      container.scrollTop = 0;

      window.__scrollTimer = setTimeout(() => {
        const diferenca = container.scrollHeight - container.clientHeight;
        if (diferenca > 15) {
          let descendo = true;
          let pausado = false;

          window.__scrollInterval = setInterval(() => {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= diferenca) {
                pausado = true;
                setTimeout(() => {
                  descendo = false;
                  pausado = false;
                }, 3000); // 3s no fim da leitura
              }
            } else {
              container.scrollTop -= 3;
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(() => {
                  pausado = false;
                }, 3500); // 3.5s no topo antes de novo ciclo
              }
            }
          }, 35);
        }
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const containerElem = document.getElementById('caption-container');
      const captionElem = document.getElementById('caption-text');
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      const timestamp = Date.now();
      let posts = [];

      try {
        const response = await fetch(./data.json?t= + timestamp);
        if (!response.ok) throw new Error(HTTP  + response.status);
        posts = await response.json();
      } catch (err) {
        console.error("Erro ao carregar data.json:", err);
      }

      if (!Array.isArray(posts) || posts.length === 0) {
        if (captionElem) captionElem.textContent = "Não foi possível carregar as informações.";
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const postParam = urlParams.get('post');
      const postIdx = parseInt(postParam, 10);

      let currentPost = posts[0];
      if (!isNaN(postIdx)) {
        currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
      }

      let texto = currentPost.caption || currentPost.text || '';
      texto = texto.replace(/\n{3,}/g, '\n\n').trim();
      if (captionElem) {
        captionElem.textContent = texto;
        iniciarAutoScroll(containerElem);
      }

      const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
      const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

      if (isFoto) {
        if (player) {
          player.pause();
          player.style.display = 'none';
        }
        if (imagePlayer) {
          imagePlayer.style.display = 'block';
          imagePlayer.src = ./ + midiaArquivo + ?t= + timestamp;
        }
      } else {
        if (imagePlayer) imagePlayer.style.display = 'none';
        if (player && videoSource) {
          player.style.display = 'block';
          player.style.backgroundColor = '#000';
          player.loop = true;

          player.onended = () => {
            player.currentTime = 0;
            player.play().catch(() => {});
          };

          videoSource.src = ./ + midiaArquivo + ?t= + timestamp;
          player.load();
          player.play().catch(e => console.log('Autoplay:', e));
        }
      }
    });
  </script>
</body>
</html>
