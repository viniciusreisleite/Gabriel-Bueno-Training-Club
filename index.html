<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mural Digital - Gabriel Bueno Training Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3vh 2.5vw;
      gap: 2.5vw;
    }

    /* Coluna de Mídia */
    .video-section {
      flex: 0 0 35%;
      height: 100%;
      background: #000000;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 3px solid #ffffff;
    }
    #player, #image-display {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.25);
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #eab308, #facc15);
      transition: width 0.1s linear;
    }

    /* Coluna Informativa (Fundo Branco Clean) */
    

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 2vh;
      border-bottom: 2px solid #f1f5f9;
    }
    .header-text {
      flex: 1;
    }
    
    .badge {
      display: inline-block;
      background: #09090b;
      color: #facc15;
      font-size: clamp(0.75rem, 1vw, 1.05rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 7px 20px;
      border-radius: 50px;
      margin-bottom: 1.2vh;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .header h1 {
      font-size: clamp(1.4rem, 2.2vw, 2.6rem);
      font-weight: 900;
      line-height: 1.2;
      color: #09090b;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .header h1 span {
      color: #ca8a04;
    }

    .logo-img {
      height: clamp(85px, 14vh, 140px);
      max-width: 260px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
    }

    /* Área de Texto Auto-Ajustável */
    
    
      
    
      .info-section {
      display: flex;
      flex-direction: column;
      height: 100vh !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      box-sizing: border-box;
      padding-bottom: 2rem;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important; /* Firefox */
      -ms-overflow-style: none !important; /* IE/Edge */
      margin-top: 1.5rem !important;
      position: relative;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important; /* Chrome / Smart TV */
    }
    .caption-box {
      font-size: 2.3vw !important;
      line-height: 1.5 !important;
      font-weight: 600 !important;
      color: #222 !important;
      word-wrap: break-word;
      padding-bottom: 4rem;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- Coluna de Mídia -->
    <div class="video-section">
      <img id="image-player" style="display:none; width:100%; height:100%; object-fit:contain; background-color:#050505;" /><video id="player" autoplay playsinline muted loop preload="auto" style="width:100%; height:100%; object-fit:contain; background-color:#050505;"><source id="video-source" src="" type="video/mp4"></video>
      <img id="image-display" alt="Publicação" style="display: none;" onerror="this.style.display='none'">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <!-- Coluna Informativa -->
    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">Hyrox Training Club</span>
          <h1>Gabriel Bueno <span>Studio Fit</span></h1>
        </div>
        <img src="logo.png" alt="Logo Studio Fit Gabriel Bueno" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações e novidades...
        </div>
      </div>
    </div>
  </div>

  <script>
            function iniciarAutoScroll(container, elemento) {
      if (!container || !elemento) return;
      if (window.__scrollTimer) clearInterval(window.__scrollTimer);
      if (window.__scrollTimeout) clearTimeout(window.__scrollTimeout);

      container.scrollTop = 0;

      window.__scrollTimeout = setTimeout(() => {
        const alturaDisponivel = container.clientHeight;
        const alturaTotal = container.scrollHeight;
        const maxScroll = alturaTotal - alturaDisponivel;

        if (maxScroll > 15) {
          let descendo = true;
          let pausado = false;

          window.__scrollTimer = setInterval(() => {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= maxScroll) {
                pausado = true;
                setTimeout(() => {
                  descendo = false;
                  pausado = false;
                }, 3000); // Pausa 3s no fim da leitura
              }
            } else {
              container.scrollTop -= 3; // Retorno suave ao topo
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(() => {
                  pausado = false;
                }, 3500); // Pausa 3.5s no topo antes de descer novamente
              }
            }
          }, 35);
        }
      }, 2000);

              if (posAtual <= 0) {
                posAtual = 0;
                elemento.style.transform = 'translateY(0px)';
                descendo = true;
                pausado = true;
                setTimeout(() => { pausado = false; }, 3000);

              }
            }

    document.addEventListener('DOMContentLoaded', async () => {
      const timestamp = Date.now();
      const containerElem = document.getElementById('caption-container') || document.querySelector('.caption-container');
      const captionElem = document.getElementById('caption-text') || document.querySelector('.caption-text');
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      try {
        const response = await fetch(`data.json?t=${timestamp}`);
        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) return;

        const urlParams = new URLSearchParams(window.location.search);
        const postParam = urlParams.get('post');
        const postIdx = parseInt(postParam, 10);

        let currentPost = posts[0];
        if (!isNaN(postIdx)) {
          currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
        }

        let texto = currentPost.caption || currentPost.text || '';
        texto = texto.replace(/\n{3,}/g, '\n\n').trim();
        if (captionElem) {
          captionElem.textContent = texto;
          if (containerElem) {
            iniciarAutoScroll(containerElem, captionElem);
            window.addEventListener('resize', () => iniciarAutoScroll(containerElem, captionElem));
          }
        }

        const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
        const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

        if (isFoto) {
          if (player) {
            player.pause();
            player.style.display = 'none';
          }
          if (imagePlayer) {
            imagePlayer.style.display = 'block';
            imagePlayer.src = `${midiaArquivo}?t=${timestamp}`;
          }
        } else {
          if (imagePlayer) imagePlayer.style.display = 'none';
          if (player && videoSource) {
            player.style.display = 'block';
            videoSource.src = `${midiaArquivo}?t=${timestamp}`;
            player.load();
            player.loop = true;
            player.onended = () => { player.currentTime = 0; player.play().catch(() => {}); };
            player.play().catch(e => console.log('Autoplay:', e));
          }
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
