name: One-shot mural update - Gabriel Bueno Training Club

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-once.yml"

permissions:
  contents: write

jobs:
  sync-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Atualizar mural
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f cookies.txt
          trap 'rm -f cookies.txt' EXIT
          printf '%s' "$INSTAGRAM_COOKIES" > cookies.txt
          python baixar_mural.py

      - name: Salvar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO_MEDIA_CHANGES=YES"
            exit 0
          fi
          git commit -m "Atualizacao manual mural Gabriel-Bueno-Training-Club"
          git push origin HEAD:main
