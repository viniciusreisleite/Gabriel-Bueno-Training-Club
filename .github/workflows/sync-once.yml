name: One-shot mural update - Gabriel-Bueno-Training-Club

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-once.yml"

permissions:
  contents: write

jobs:
  sync-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install playwright yt-dlp
          playwright install chromium --with-deps

      - name: Refresh mural
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          set -euo pipefail
          python sync_instagram.py

      - name: Commit refreshed media
        run: |
          set -euo pipefail
          rm -f cookies.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q HEAD -- .github/workflows/sync-once.yml || true
          if git diff --cached --quiet; then
            echo "NO_CHANGES=YES"
            exit 0
          fi
          git commit -m "Atualizacao manual mural Gabriel-Bueno-Training-Club [skip ci]"
          git push origin HEAD:main
